<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GHN Attendance</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --cyan: #00e5ff;
      --bg: #080d14;
      --card: rgba(19, 29, 42, .88);
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: #eaf7ff;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, #103044 0, transparent 35%),
        radial-gradient(circle at 85% 80%, #102b35 0, transparent 35%),
        var(--bg);
    }

    .main-container {
      max-width: 1100px;
      margin: auto;
      padding: 24px 16px;
    }

    .header-banner {
      min-height: 145px;
      margin-bottom: 28px;
      border: 1px solid rgba(0,229,255,.35);
      border-radius: 18px;
      background:
        linear-gradient(110deg, rgba(0,229,255,.15), rgba(0,0,0,.1)),
        linear-gradient(135deg, #142c3b, #080d14);
      box-shadow: 0 0 30px rgba(0,229,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .header-banner h1 {
      color: white;
      font-size: clamp(25px, 5vw, 38px);
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0;
    }

    .header-banner p {
      color: var(--cyan);
      letter-spacing: 3px;
      font-size: 12px;
      margin: 8px 0 0;
    }

    .glass-card {
      height: 100%;
      padding: 26px;
      border: 1px solid rgba(0,229,255,.25);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
      backdrop-filter: blur(15px);
    }

    .glass-card h4 {
      color: var(--cyan);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .glass-card hr {
      border-color: rgba(0,229,255,.25);
      margin: 20px 0;
    }

    label {
      color: #d9e8f2;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .form-control, .form-select {
      min-height: 46px;
      color: white;
      background: #101d2a;
      border: 1px solid #294254;
      border-radius: 9px;
    }

    .form-control:focus, .form-select:focus {
      color: white;
      background: #101d2a;
      border-color: var(--cyan);
      box-shadow: 0 0 0 .2rem rgba(0,229,255,.12);
    }

    .form-control::placeholder { color: #718096; }

    .form-select option {
      color: white;
      background: #101d2a;
    }

    .btn-ghn {
      min-height: 48px;
      color: #00151b;
      font-weight: 800;
      letter-spacing: 1px;
      background: var(--cyan);
      border: none;
      border-radius: 9px;
    }

    .btn-ghn:hover {
      color: #00151b;
      background: #70f0ff;
    }

    .btn-outline-info {
      min-height: 45px;
      font-weight: 700;
      border-radius: 9px;
    }

    button:disabled {
      opacity: .45 !important;
      cursor: not-allowed;
    }

    .info-panel {
      padding: 17px;
      border: 1px solid rgba(0,229,255,.2);
      border-radius: 12px;
      background: rgba(0,229,255,.045);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.07);
      font-size: 14px;
    }

    .info-row:last-child { border: 0; }

    .info-row span:first-child { color: var(--muted); }
    .info-row strong { text-align: right; }

    .status-message {
      padding: 12px;
      margin-top: 14px;
      border-radius: 9px;
      font-size: 14px;
      display: none;
    }

    .status-success {
      display: block;
      color: #8df5c0;
      background: rgba(16,185,129,.12);
      border: 1px solid rgba(16,185,129,.3);
    }

    .status-error {
      display: block;
      color: #ff9b9b;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
    }

    .status-loading {
      display: block;
      color: var(--cyan);
      background: rgba(0,229,255,.08);
    }

    .placeholder-box {
      padding: 28px 10px;
      color: var(--muted);
      text-align: center;
    }

    .placeholder-box i {
      color: var(--cyan);
      font-size: 48px;
    }

    footer {
      padding: 25px 0 5px;
      color: #718096;
      text-align: center;
      font-size: 12px;
    }

    @media(max-width: 576px) {
      .main-container { padding: 15px 12px; }
      .glass-card { padding: 20px 16px; }
      .header-banner { min-height: 115px; }
    }
  </style>
</head>

<body>
<div class="main-container">

  <header class="header-banner">
    <div>
      <h1>GHN ATTENDANCE</h1>
      <p>YOUR LOADS. OUR ROADS.</p>
    </div>
  </header>

  <div class="row g-4">

    <!-- CHECK IN -->
    <div class="col-lg-6 col-12">
      <section class="glass-card">
        <h4>
          <i class="bi bi-box-arrow-in-right"></i>
          CHECK IN
        </h4>
        <hr>

        <div class="mb-3">
          <label for="employeeId">Mã nhân viên</label>
          <input id="employeeId"
                 type="text"
                 class="form-control"
                 autocomplete="off"
                 placeholder="Nhập mã nhân viên">
        </div>

        <button type="button"
                class="btn btn-outline-info w-100"
                id="lookupEmployeeButton"
                onclick="lookupEmployee()">
          <i class="bi bi-search"></i>
          KIỂM TRA THÔNG TIN
        </button>

        <div id="employeeInfo" class="mt-3">
          <div class="placeholder-box">
            <i class="bi bi-person-circle"></i>
            <p class="mt-2">Nhập mã nhân viên để tra cứu thông tin.</p>
          </div>
        </div>

        <div class="mb-3 mt-3">
          <label for="shiftSelect">Ca làm việc</label>
          <select id="shiftSelect" class="form-select" disabled>
            <option value="">-- Kiểm tra mã nhân viên trước --</option>
          </select>
        </div>

        <button type="button"
                class="btn btn-ghn w-100"
                id="checkinButton"
                onclick="checkIn()"
                disabled>
          <i class="bi bi-check-circle"></i>
          CHECK IN
        </button>

        <div id="checkinMessage" class="status-message"></div>
      </section>
    </div>

    <!-- CHECK OUT -->
    <div class="col-lg-6 col-12">
      <section class="glass-card">
        <h4>
          <i class="bi bi-box-arrow-right"></i>
          CHECK OUT
        </h4>
        <hr>

        <div class="mb-3">
          <label for="checkoutEmployeeId">Mã nhân viên</label>
          <input id="checkoutEmployeeId"
                 type="text"
                 class="form-control"
                 autocomplete="off"
                 placeholder="Nhập mã nhân viên">
        </div>

        <button type="button"
                class="btn btn-outline-info w-100"
                id="checkoutLookupButton"
                onclick="kiemTraCheckOut()">
          <i class="bi bi-search"></i>
          KIỂM TRA
        </button>

        <div id="checkoutInfo" class="mt-3">
          <div class="placeholder-box">
            <i class="bi bi-person-check"></i>
            <h5 class="mt-3">THÔNG TIN CHECK IN</h5>
            <p>Nhập mã nhân viên và nhấn KIỂM TRA.</p>
          </div>
        </div>

        <button type="button"
                class="btn btn-ghn w-100 mt-3"
                id="checkoutButton"
                onclick="checkOut()"
                disabled>
          <i class="bi bi-box-arrow-right"></i>
          CHECK OUT
        </button>

        <div id="checkoutMessage" class="status-message"></div>
      </section>
    </div>

  </div>

  <footer>GHN Attendance System</footer>
</div>

<script>
  let currentEmployee = null;
  let currentCheckoutEmployee = '';
  let checkoutReady = false;

  function showMessage(id, message, type) {
    const el = document.getElementById(id);
    el.className = 'status-message status-' + type;
    el.textContent = message;
  }

  function clearMessage(id) {
    const el = document.getElementById(id);
    el.className = 'status-message';
    el.textContent = '';
  }

  function setLoading(buttonId, loading, text) {
    const button = document.getElementById(buttonId);
    button.disabled = loading;

    if (loading) {
      button.dataset.oldText = button.innerHTML;
      button.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>' + text;
    } else if (button.dataset.oldText) {
      button.innerHTML = button.dataset.oldText;
    }
  }

  function callApi(action, params, onSuccess, onFailure) {
    const runner = google.script.run
      .withSuccessHandler(function(result) {
        if (onSuccess) onSuccess(result);
      })
      .withFailureHandler(function(error) {
        if (onFailure) onFailure(error);
      });

    runner.GHN_V5_uiApi(action, params || {});
  }

  function lookupEmployee() {
    const employeeId =
      document.getElementById('employeeId').value.trim();

    if (!employeeId) {
      showMessage('checkinMessage', 'Vui lòng nhập mã nhân viên.', 'error');
      return;
    }

    setLoading('lookupEmployeeButton', true, 'ĐANG KIỂM TRA...');
    clearMessage('checkinMessage');

    callApi('getEmployee', { employeeId: employeeId }, function(result) {
      setLoading('lookupEmployeeButton', false);

      if (!result || result.success === false) {
        currentEmployee = null;
        resetShift();
        document.getElementById('employeeInfo').innerHTML =
          '<div class="info-panel text-danger">Không tìm thấy thông tin nhân viên.</div>';
        showMessage('checkinMessage',
          result && result.message ? result.message : 'Không tìm thấy nhân viên.',
          'error');
        return;
      }

      currentEmployee = employeeId;
      renderEmployee(result);
      loadShifts(employeeId);

    }, function(error) {
      setLoading('lookupEmployeeButton', false);
      showMessage('checkinMessage', error.message || String(error), 'error');
    });
  }

  /* HIỂN THỊ 3 THÔNG TIN NHÂN VIÊN */
  function renderEmployee(data) {
    const employee = data.employee || data.data || data;

    const fields = [
      ['Họ và tên', employee.name || employee.fullName],
      ['Mã nhân viên', employee.employeeId || employee.id || employee.code],
      ['Điểm làm việc', employee.workPoint || employee.workpoint]
    ];

    let html = '<div class="info-panel">';

    fields.forEach(function(item) {
      if (item[1] !== undefined && item[1] !== null && item[1] !== '') {
        html += '<div class="info-row"><span>' +
          escapeHtml(item[0]) + '</span><strong>' +
          escapeHtml(item[1]) + '</strong></div>';
      }
    });

    html += '</div>';
    document.getElementById('employeeInfo').innerHTML = html;
  }

  function loadShifts(employeeId) {
    callApi('getShifts', { employeeId: employeeId }, function(result) {
      const select = document.getElementById('shiftSelect');
      select.innerHTML = '';

      if (!result || result.success === false) {
        select.innerHTML =
          '<option value="">Không lấy được danh sách ca</option>';
        select.disabled = true;
        showMessage('checkinMessage',
          result && result.message ? result.message : 'Không có dữ liệu ca.',
          'error');
        return;
      }

      const shifts = Array.isArray(result)
        ? result
        : (result.shifts || result.data || []);

      if (!shifts.length) {
        select.innerHTML = '<option value="">Không có ca làm việc</option>';
        select.disabled = true;
        return;
      }

      select.innerHTML = '<option value="">-- Chọn ca làm việc --</option>';

      shifts.forEach(function(item) {
        const value = typeof item === 'string'
          ? item
          : (item.shift || item.name || item.value || '');

        if (!value) return;

        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });

      select.disabled = false;
      document.getElementById('checkinButton').disabled = false;

    }, function(error) {
      showMessage('checkinMessage', error.message || String(error), 'error');
    });
  }

  function resetShift() {
    const select = document.getElementById('shiftSelect');
    select.innerHTML =
      '<option value="">-- Kiểm tra mã nhân viên trước --</option>';
    select.disabled = true;
    document.getElementById('checkinButton').disabled = true;
  }

  function checkIn() {
    const employeeId = currentEmployee;
    const shift = document.getElementById('shiftSelect').value;

    if (!employeeId || !shift) {
      showMessage('checkinMessage',
        'Vui lòng kiểm tra nhân viên và chọn ca làm việc.',
        'error');
      return;
    }

    setLoading('checkinButton', true, 'ĐANG CHECK IN...');
    clearMessage('checkinMessage');

    callApi('checkIn', {
      employeeId: employeeId,
      shift: shift
    }, function(result) {
      setLoading('checkinButton', false);

      if (result && result.success !== false) {
        showMessage('checkinMessage',
          result.message || 'Check In thành công.',
          'success');
      } else {
        showMessage('checkinMessage',
          result && result.message ? result.message : 'Check In thất bại.',
          'error');
      }
    }, function(error) {
      setLoading('checkinButton', false);
      showMessage('checkinMessage', error.message || String(error), 'error');
    });
  }

  function kiemTraCheckOut() {
    const employeeId =
      document.getElementById('checkoutEmployeeId').value.trim();

    if (!employeeId) {
      showMessage('checkoutMessage', 'Vui lòng nhập mã nhân viên.', 'error');
      return;
    }

    setLoading('checkoutLookupButton', true, 'ĐANG KIỂM TRA...');
    clearMessage('checkoutMessage');

    currentCheckoutEmployee = employeeId;
    checkoutReady = false;
    document.getElementById('checkoutButton').disabled = true;

    callApi('getCheckInInfo', { employeeId: employeeId }, function(result) {
      setLoading('checkoutLookupButton', false);

      if (!result || result.success === false) {
        document.getElementById('checkoutInfo').innerHTML =
          '<div class="info-panel text-danger">Không có thông tin Check In.</div>';
        showMessage('checkoutMessage',
          result && result.message ? result.message : 'Không có dữ liệu chấm công trong ngày.',
          'error');
        return;
      }

      renderCheckoutInfo(result);

      const hasOpenShift = result.hasOpenShift === true;

      if (hasOpenShift) {
        checkoutReady = true;
        document.getElementById('checkoutButton').disabled = false;
        showMessage('checkoutMessage',
          'Bạn đang có ca chưa CHECK OUT.',
          'success');
      } else {
        showMessage('checkoutMessage',
          result.message || 'Đã hiển thị thông tin chấm công trong ngày. Không có ca đang mở.',
          'success');
      }

    }, function(error) {
      setLoading('checkoutLookupButton', false);
      showMessage('checkoutMessage', error.message || String(error), 'error');
    });
  }

  function renderCheckoutInfo(data) {
    const employee = data.employee || {};
    const records = Array.isArray(data.records) ? data.records : [];
    let html = '<div class="info-panel mb-3">';

    const employeeFields = [
      ['Mã nhân viên', employee.id || currentCheckoutEmployee],
      ['Họ và tên', employee.name || ''],
      ['Điểm làm việc', employee.workPoint || data.workPoint || '']
    ];

    employeeFields.forEach(function(item) {
      if (item[1]) {
        html += '<div class="info-row"><span>' +
          escapeHtml(item[0]) + '</span><strong>' +
          escapeHtml(item[1]) + '</strong></div>';
      }
    });

    html += '</div>';

    if (!records.length) {
      html += '<div class="info-panel text-secondary text-center">' +
        'Không có dữ liệu chấm công trong ngày.' +
        '</div>';
    }

    records.forEach(function(record, index) {
      const statusClass = record.isOpen ? 'text-warning' : 'text-success';

      html += '<div class="info-panel mb-2">';
      html += '<div class="d-flex justify-content-between align-items-center mb-2">' +
        '<strong>CA ' + (index + 1) + '</strong>' +
        '<strong class="' + statusClass + '">' +
        escapeHtml(record.status || '') +
        '</strong></div>';

      const fields = [
        ['Ngày làm việc', record.workDate || ''],
        ['Ca làm việc', record.shift || ''],
        ['Giờ CHECK IN', record.checkIn || 'Chưa có'],
        ['Giờ CHECK OUT', record.checkOut || 'Chưa CHECK OUT']
      ];

      fields.forEach(function(item) {
        html += '<div class="info-row"><span>' +
          escapeHtml(item[0]) + '</span><strong>' +
          escapeHtml(item[1]) + '</strong></div>';
      });

      html += '</div>';
    });

    document.getElementById('checkoutInfo').innerHTML = html;
  }

  function checkOut() {
    if (!currentCheckoutEmployee || !checkoutReady) return;

    setLoading('checkoutButton', true, 'ĐANG CHECK OUT...');
    clearMessage('checkoutMessage');

    callApi('checkOut', {
      employeeId: currentCheckoutEmployee
    }, function(result) {
      setLoading('checkoutButton', false);

      if (result && result.success !== false) {
        checkoutReady = false;
        document.getElementById('checkoutButton').disabled = true;

        showMessage('checkoutMessage',
          result.message || 'Check Out thành công.',
          'success');

        // Tải lại lịch sử trong ngày để cập nhật giờ IN và OUT.
        kiemTraCheckOut();
      } else {
        showMessage('checkoutMessage',
          result && result.message ? result.message : 'Check Out thất bại.',
          'error');
      }
    }, function(error) {
      setLoading('checkoutButton', false);
      showMessage('checkoutMessage', error.message || String(error), 'error');
    });
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  document.getElementById('employeeId')
    .addEventListener('keydown', function(event) {
      if (event.key === 'Enter') lookupEmployee();
    });

  document.getElementById('checkoutEmployeeId')
    .addEventListener('keydown', function(event) {
      if (event.key === 'Enter') kiemTraCheckOut();
    });
</script>

</body>
</html>
